<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 단어 추출 및 발음기호 비교기</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; background: #fafafa; color: #222; }
  textarea { width: 100%; height: 130px; font-size: 16px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; }
  .row { display: flex; gap: 8px; margin: 10px 0; align-items: center; flex-wrap: wrap; }
  button { font-size: 14px; padding: 7px 13px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; background: #fff; }
  button.primary { background: #3b6fd8; color: #fff; border-color: #3b6fd8; font-weight: 600; }
  button.seq { background: #eef4ff; color: #2b57b5; border-color: #6a8fd8; font-weight: 600; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; align-items: center; }
  .presets span { font-size: 12px; color: #555; font-weight: 600; }
  .preset-btn { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: #fff; border: 1px solid #ddd; }
  .preset-btn:hover { border-color: #3b6fd8; color: #3b6fd8; }
  select { font-size: 14px; padding: 6px; max-width: 100%; }
  ul { list-style: none; padding: 0; }
  li { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid #e3e3e3; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  li button { background: #fff; border: 1px solid #ccc; border-radius: 6px; font-size: 18px; min-width: 155px; text-align: left; flex-shrink: 0; font-weight: 600; }
  li button .ipa { display: block; font-size: 13px; color: #3b6fd8; font-weight: 600; margin-top: 3px; }
  li button:hover { background: #e8f0ff; border-color: #6a8fd8; }
  li button.playing { background: #cfe0ff; border-color: #3b6fd8; }
  .meaning { font-size: 15px; line-height: 1.5; }
  .ko { color: #222; }
  .ko b { color: #6a8fd8; font-weight: normal; font-size: 12px; margin-right: 4px; }
  .en { color: #777; font-size: 13px; margin-top: 2px; }
  .count { color: #666; font-size: 14px; }
</style>
</head>
<body>
<h2>영어 단어 추출 · 발음 &amp; 발음기호(IPA) 비교기 🔊</h2>
<textarea id="input" placeholder="비교할 단어나 영어 문장을 입력하세요. (예: glove, globe 또는 일기·대본 문장 전체)"></textarea>
<div class="presets">
  <span>추천 비교:</span>
  <button type="button" class="preset-btn" data-words="glove, globe">glove vs. globe</button>
  <button type="button" class="preset-btn" data-words="phase, phrase">phase vs. phrase</button>
  <button type="button" class="preset-btn" data-words="chill, chilly">chill vs. chilly</button>
  <button type="button" class="preset-btn" data-words="bad, bed">bad vs. bed</button>
  <button type="button" class="preset-btn" data-words="cap, cup">cap vs. cup</button>
  <button type="button" class="preset-btn" data-words="work, walk">work vs. walk</button>
  <button type="button" class="preset-btn" data-words="desert, dessert">desert vs. dessert</button>
  <button type="button" class="preset-btn" data-words="though, thought, through">though / thought / through</button>
</div>
<div class="row">
  <button id="extract" class="primary">단어 추출 · 발음기호 비교</button>
  <button id="playSeq" class="seq" style="display:none;">▶️ 순서대로 연속 비교 듣기</button>
  <label><input type="checkbox" id="dedupe" checked> 중복 제거</label>
  <label><input type="checkbox" id="lower" checked> 소문자로</label>
</div>
<div class="row">
  음성: <select id="voice"></select>
  <label><input type="checkbox" id="useDict" checked> 사전 녹음 발음 우선</label>
</div>
<div class="count" id="count"></div>
<ul id="list"></ul>

<script>
const $ = id => document.getElementById(id);
let voices = [];
let currentWords = [];
let seqPlaying = false;

function loadVoices() {
  voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
  const score = v => (v.lang === 'en-US' ? 0 : v.lang === 'en-GB' ? 1 : 2)
    - (/Samantha|Google US|Alex|Ava|Daniel/i.test(v.name) ? 0.5 : 0);
  voices.sort((a, b) => score(a) - score(b));
  $('voice').innerHTML = voices.map((v, i) => `<option value="${i}">${v.name} (${v.lang})</option>`).join('');
}
loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;

function extract(text) {
  let words = text.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g) || [];
  if ($('lower').checked) words = words.map(w => w.toLowerCase());
  if ($('dedupe').checked) words = [...new Set(words)];
  return words;
}

function tts(word) {
  return new Promise(resolve => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    const v = voices[$('voice').value];
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }
    u.rate = 0.92;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

const audioCache = {};
const dictCache = {};
async function prefetch(word) {
  if (word in audioCache) return showEnglishDef(word, dictCache[word]);
  try {
    const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word.toLowerCase()));
    const data = dictCache[word] = await res.json();
    const phonetics = Array.isArray(data) ? data.flatMap(d => d.phonetics || []) : [];
    showEnglishDef(word, data);
    const pick = phonetics.find(p => p.audio && /-us\.mp3$/.test(p.audio)) || phonetics.find(p => p.audio);
    if (!pick) return audioCache[word] = null;
    const a = new Audio(pick.audio);
    a.preload = 'auto';
    a.load();
    audioCache[word] = a;
  } catch { audioCache[word] = null; }
}

const POS_KO = { noun: '명', verb: '동', adjective: '형', adverb: '부', pronoun: '대', preposition: '전', conjunction: '접', interjection: '감', abbreviation: '약' };
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cell = (word, cls) => document.querySelector(`li[data-word="${CSS.escape(word)}"] .${cls}`);

async function fetchKorean(word) {
  const el = cell(word, 'ko');
  try {
    const res = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&dt=bd&q=' + encodeURIComponent(word));
    const d = await res.json();
    const dict = d[1] || [];
    const html = dict.length
      ? dict.map(e => `<b>${POS_KO[e[0]] || e[0]}</b>${esc(e[1].slice(0, 5).join(', '))}`).join('<br>')
      : esc(d[0].map(x => x[0]).join(''));
    if (el) el.innerHTML = html;
  } catch { if (el) el.textContent = '(뜻을 불러오지 못함)'; }
}

function showEnglishDef(word, data) {
  const el = cell(word, 'en');
  const ipaEl = document.querySelector(`li[data-word="${CSS.escape(word)}"] .ipa`);
  if (ipaEl && Array.isArray(data)) {
    const phonetics = data.flatMap(d => d.phonetics || []);
    const usIpa = phonetics.find(p => p.text && /-us\.mp3$/i.test(p.audio || ''))?.text;
    const anyIpa = data.find(d => d.phonetic)?.phonetic || phonetics.find(p => p.text)?.text;
    const ipaText = usIpa || anyIpa || '';
    if (ipaText) ipaEl.textContent = ipaText;
  }
  if (!el) return;
  const m = Array.isArray(data) && data[0].meanings && data[0].meanings[0];
  const def = m && m.definitions[0] && m.definitions[0].definition;
  el.textContent = def ? `(${m.partOfSpeech}) ${def}` : '';
}

function play(word, btn) {
  return new Promise(resolve => {
    if (btn) btn.classList.add('playing');
    const finish = () => {
      if (btn) btn.classList.remove('playing');
      resolve();
    };
    const a = audioCache[word];
    if ($('useDict').checked && a && a.readyState >= 3) {
      speechSynthesis.cancel();
      a.currentTime = 0;
      a.onended = finish;
      a.onerror = finish;
      a.play().catch(() => tts(word).then(finish));
      return;
    }
    tts(word).then(finish);
  });
}

$('extract').onclick = () => {
  const words = extract($('input').value);
  currentWords = words;
  $('count').textContent = `${words.length}개 단어`;
  $('playSeq').style.display = words.length > 1 ? 'inline-block' : 'none';
  $('list').innerHTML = '';
  words.forEach(w => {
    const li = document.createElement('li');
    li.dataset.word = w;
    li.innerHTML = `<button>🔊 ${esc(w)}<span class="ipa"></span></button><div class="meaning"><div class="ko">…</div><div class="en"></div></div>`;
    const b = li.querySelector('button');
    b.onclick = () => { seqPlaying = false; play(w, b); };
    $('list').appendChild(li);
  });
  words.forEach(w => { fetchKorean(w); prefetch(w); });
  speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(' '), { volume: 0 }));
};

$('playSeq').onclick = async () => {
  if (!currentWords.length || seqPlaying) return;
  seqPlaying = true;
  $('playSeq').textContent = '🔊 연속 재생 중…';
  for (const w of currentWords) {
    if (!seqPlaying) break;
    const btn = document.querySelector(`li[data-word="${CSS.escape(w)}"] button`);
    await play(w, btn);
    await new Promise(r => setTimeout(r, 380));
  }
  seqPlaying = false;
  $('playSeq').textContent = '▶️ 순서대로 연속 비교 듣기';
};

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.onclick = () => {
    $('input').value = btn.dataset.words;
    $('extract').click();
  };
});

$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('extract').click();
});
</script>
</body>
</html>
